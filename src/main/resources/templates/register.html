<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><main class="auth-card"><h1>Đăng ký</h1><p class="error" th:if="${message}" th:text="${message}"></p>
<form th:action="@{/register}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Username<input name="username" required></label><label>Email<input name="email" type="email" required></label>
<label>Họ tên<input name="fullName"></label><label>Password<input name="password" type="password" minlength="6" required></label>
<label>Confirm Password<input name="confirmPassword" type="password" minlength="6" required></label>
<button class="primary">Đăng ký &amp; nhận OTP</button></form><a href="/login">Đã có tài khoản?</a></main></body></html>
