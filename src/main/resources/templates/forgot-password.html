<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quên mật khẩu</title></head><body>
<h1>Quên mật khẩu</h1><p th:if="${message}" th:text="${message}"></p><form th:action="@{/forgot-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input name="email" type="email" required placeholder="Email"><button>Gửi OTP</button></form><a href="/login">Quay lại</a></body></html>
