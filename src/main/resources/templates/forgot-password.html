<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quên mật khẩu</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><main class="auth-card"><h1>Quên mật khẩu</h1>
<p class="error" th:if="${message}" th:text="${message}"></p><p class="notice">Nhập email đã đăng ký để nhận mã OTP đặt lại mật khẩu.</p>
<form th:action="@{/forgot-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Email<input name="email" type="email" required placeholder="Email"></label><button class="primary">Gửi OTP</button></form>
<a href="/login">Quay lại Login</a></main></body></html>
