<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title></head><body>
<h1>Ví dụ 3: CRUD sản phẩm - ADMIN</h1><form th:action="@{/admin/products}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input name="name" required placeholder="Tên"><input name="price" type="number" step="0.01" min="0" required placeholder="Giá"><button>Thêm</button></form>
<ul><li th:each="product : ${products}"><span th:text="${product.name}"></span> - <span th:text="${product.price}"></span>
<form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" style="display:inline">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button>Xóa</button></form></li></ul><a href="/profile">Tài khoản</a> | <a href="/examples">Các ví dụ</a></body></html>
