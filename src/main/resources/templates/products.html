<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="admin-page"><nav class="navbar"><span class="brand">IOTSTAR SHOP</span><a th:href="@{/admin/dashboard}">Dashboard</a><a th:href="@{/admin/products}">Products</a><span class="spacer"></span><a th:href="@{/profile}">Tài khoản</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Logout</button></form></nav>
<main class="content"><h1>Quản lý Products</h1><div class="toolbar"><input placeholder="Tên sản phẩm, mã..."><button>Tìm kiếm</button><span class="spacer"></span></div><form class="toolbar" th:action="@{/admin/products}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input name="name" required placeholder="Tên sản phẩm"><input name="price" type="number" step="0.01" min="0" required placeholder="Giá"><button>+ Thêm Product</button></form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Ảnh</th><th>Name</th><th>Price</th><th>Action</th></tr></thead><tbody><tr th:each="product : ${products}"><td th:text="${product.id}"></td><td>-</td><td th:text="${product.name}"></td><td th:text="${product.price}"></td><td>
<form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="danger">Delete</button></form></td></tr></tbody></table></div></main><footer>© 2026 IOTSTAR SHOP - Spring Boot</footer></body></html>
