<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Thông tin tài khoản</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="admin-page"><nav class="navbar"><span class="brand">IOTSTAR SHOP</span><a th:href="@{/examples}">Examples</a><span class="spacer"></span><a th:href="@{/admin/dashboard}">Dashboard</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Logout</button></form></nav>
<main class="content"><h1>Thông tin tài khoản</h1><div class="profile-card"><p>Username: <b th:text="${account.username}"></b></p><p>Email: <b th:text="${account.email}"></b></p>
<p>Họ tên: <b th:text="${account.fullName ?: 'Chưa cập nhật'}"></b></p><p>Role: <b th:text="${account.role}"></b></p></div><a class="button-link" href="/admin/products">Quản lý sản phẩm</a></main><footer>© 2026 IOTSTAR SHOP - Spring Boot</footer></body></html>
