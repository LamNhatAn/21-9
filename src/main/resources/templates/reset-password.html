<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><main class="auth-card"><h1>Đặt lại mật khẩu</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p class="error" th:if="${message}" th:text="${message}"></p>
<form th:action="@{/reset-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Mã OTP<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Nhập OTP"></label>
<label>Mật khẩu mới<input name="password" type="password" minlength="6" required placeholder="Mật khẩu mới"></label>
<button class="primary">Đổi mật khẩu</button></form><a href="/login">Quay lại Login</a></main></body></html>
