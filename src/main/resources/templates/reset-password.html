<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title></head><body>
<h1>Đặt lại mật khẩu</h1><p th:if="${notice}" th:text="${notice}"></p><p th:if="${message}" th:text="${message}"></p>
<form th:action="@{/reset-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input name="otp" pattern="[0-9]{6}" required placeholder="OTP"><input name="password" type="password" minlength="6" required placeholder="Mật khẩu mới"><button>Đổi mật khẩu</button></form></body></html>
