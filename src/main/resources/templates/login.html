<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title></head>
<body><h1>Ví dụ 1 & 2: Đăng nhập</h1><p>Hỗ trợ username hoặc email.</p>
<p th:if="${message}" th:text="${message}"></p><form th:action="@{/login}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Username/email <input name="identifier" required autofocus></label><br>
<label>Mật khẩu <input name="password" type="password" required></label><br><button>Đăng nhập</button></form>
<a th:href="@{/register}">Đăng ký</a> | <a th:href="@{/forgot-password}">Quên mật khẩu</a> |
<a th:href="@{/examples}">Xem các ví dụ</a></body></html>
