<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xác thực OTP</title></head><body>
<h1>Xác thực OTP</h1><p th:if="${notice}" th:text="${notice}"></p><p th:if="${message}" th:text="${message}"></p>
<form th:action="@{/verify}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input name="otp" pattern="[0-9]{6}" required placeholder="6 chữ số"><button>Xác thực</button></form></body></html>
