<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xác thực OTP</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><main class="auth-card"><h1>Xác thực OTP</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p class="error" th:if="${message}" th:text="${message}"></p>
<form th:action="@{/verify}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Mã OTP<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Nhập 6 chữ số"></label><button class="primary">Xác thực tài khoản</button></form>
<a href="/login">Quay lại Login</a></main></body></html>
